      - name: Inflate the exact bounded preparation
        shell: python
        run: |
          import hashlib, lzma, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP']) / 'papers-publish-bootstrap'
          packed = (base / 'foundation.zip.xz').read_bytes()
          if len(packed) > 500_000 or hashlib.sha256(packed).hexdigest() != '8f671f64f40ef77af6d173440c9e2e94d3f7888defb457f27b0d95d6409b4603':
              raise SystemExit('Compressed preparation integrity check failed')
          inflater = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=64 * 1024 * 1024)
          raw = inflater.decompress(packed, max_length=3_000_001)
          if len(raw) > 3_000_000 or not inflater.eof or inflater.unused_data:
              raise SystemExit('Compressed preparation exceeds bounds or has trailing/incomplete data')
          if hashlib.sha256(raw).hexdigest() != '46d4dae86727140569001ba899d85a21ec329e016ef8c16d66793ad2d70e27ea':
              raise SystemExit('Prepared archive integrity check failed')
          (base / 'foundation.zip').write_bytes(raw)
      - name: Check the exact plan, research records and regression tests before remote writes
        run: python3 "$RUNNER_TEMP/papers-publish-bootstrap/publisher.py" --validate-only
      - name: Publish only the contribution-branch files and missing declared issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/papers-publish-bootstrap/publisher.py" --apply
      - name: Record actual observations and partial-failure checkpoints
        if: always()
        run: python3 "$RUNNER_TEMP/papers-publish-bootstrap/publisher.py" --summarize
