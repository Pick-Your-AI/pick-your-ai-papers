      - name: Verify the bounded payload and runtime
        shell: python
        run: |
          import hashlib, lzma, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP']) / 'papers-finalization'
          packed = (base / 'payload.json.xz').read_bytes()
          if len(packed) > 300_000 or hashlib.sha256(packed).hexdigest() != '9df5168792a9a34d7e55866a850424caed002694063be0ebab92051c484e8fb9':
              raise SystemExit('Compressed payload integrity check failed')
          decoder = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=64 * 1024 * 1024)
          raw = decoder.decompress(packed, max_length=5000001)
          if len(raw) > 5000000 or not decoder.eof or decoder.unused_data:
              raise SystemExit('Payload exceeds bounds or has trailing/incomplete data')
          if hashlib.sha256(raw).hexdigest() != 'b61442b1962c03edeb6ee2e3133c54120219557a761ae203ee343aaf3c5e9852':
              raise SystemExit('Decoded payload integrity check failed')
          if hashlib.sha256((base / 'finalizer.py').read_bytes()).hexdigest() != '6f95744f6362b55964b9f75ec90b6215d4d4d67e71eeab539342cf15486731cc':
              raise SystemExit('Finalizer implementation identity differs')
          (base / 'payload.json').write_bytes(raw)
      - name: Validate the exact candidate without an API token
        run: python3 "$RUNNER_TEMP/papers-finalization/finalizer.py" --validate-only
      - name: Publish only the ten validated receipt and documentation paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/papers-finalization/finalizer.py" --apply
      - name: Record actual outcomes and the required cleanup tree
        if: always()
        run: python3 "$RUNNER_TEMP/papers-finalization/finalizer.py" --summarize
