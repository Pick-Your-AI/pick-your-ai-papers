name: Publish exact Papers setup receipts on the contribution branch

on:
  push:
    branches: [contrib/papers-bootstrap/foundation]
    paths: [.github/workflows/papers-finalize-receipts.yml]

permissions: {}

concurrency:
  group: papers-bounded-receipt-finalization
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Pick-Your-AI/pick-your-ai-papers' &&
      github.repository_id == '1430404173' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/contrib/papers-bootstrap/foundation' &&
      github.actor == 'CompleteDotTech' &&
      github.actor_id == '5861166' &&
      github.triggering_actor == 'CompleteDotTech' &&
      github.event.sender.login == 'CompleteDotTech' &&
      github.event.sender.id == 5861166 &&
      github.event.repository.id == 1430404173 &&
      github.event.repository.fork == false &&
      github.event.repository.private == false &&
      github.event.deleted == false &&
      github.event.forced == false &&
      contains(github.event.head_commit.message, '[finalize-papers-foundation]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact UI trigger without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
